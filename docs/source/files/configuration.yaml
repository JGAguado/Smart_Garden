esphome:
  name: smart-garden

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  password: ***********

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Smart-Garden"
    password: "SmartGarden"

captive_portal:

# These relays will automatically turn off after 2 minutes
switch:
  - platform: gpio
    pin: 16
    id: relay_1
    name: "Zone 1"
    icon: "mdi:sprinkler-variant"
    on_turn_on:
    - delay: 120s
    - switch.turn_off: relay_1    
    
  - platform: gpio
    pin: 17
    id: relay_2
    name: "Zone 2"
    icon: "mdi:sprinkler-variant"
    on_turn_on:
      - delay: 120s
      - switch.turn_off: relay_2
    
  - platform: gpio
    pin: 18
    id: relay_3
    name: "Zone 3"
    icon: "mdi:sprinkler-variant"
    on_turn_on:
      - delay: 120s
      - switch.turn_off: relay_3      
    
  - platform: gpio
    pin: 19
    id: relay_4
    name: "Zone 4"
    icon: "mdi:sprinkler-variant"
    on_turn_on:
      - delay: 120s
      - switch.turn_off: relay_4  

sensor:
  - platform: adc
    pin: A4
    name: "VCC"
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 0 -> 0
          - 0.55 -> 5