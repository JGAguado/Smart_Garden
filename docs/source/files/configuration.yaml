substitutions:
  device_name: "smart-garden"
  friendly_name: "Smart Garden"
  project_name: "smart.garden"
  project_version: "2.0"
  ap_pwd: "smartgarden"

esphome:
  name: "${device_name}"
  name_add_mac_suffix: true
  project:
    name: "${project_name}"
    version: "${project_version}"

esp32:
  board: esp32-s2-saola-1
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:

# Enable Over The Air updates
ota:

#Public location of this yaml file
dashboard_import:
  package_import_url: github://JGAguado/Smart_Garden/docs/source/files/configuration.yaml@V2R1
  import_full_config: false

# Enable fallback hotspot (captive portal) in case wifi connection fails
captive_portal:

improv_serial:

wifi:
  ap:
    password: "${ap_pwd}"


sprinkler:
  - id: sprinkler_ctrlr
    main_switch: "Lawn Sprinklers"
    auto_advance_switch: "Lawn Sprinklers Auto Advance"
    reverse_switch: "Lawn Sprinklers Reverse"
    multiplier_number: "Lawn Sprinkler Multiplier"
    repeat_number: "Lawn Sprinkler Repeat"
    valve_overlap: 0s
    valves:
      - valve_switch: "Zone 1"
        enable_switch: "Enable Zone 1"
        run_duration_number: "Zone 1 Duration"
        valve_switch_id: relay_1
      - valve_switch: "Zone 2"
        enable_switch: "Enable Zone 2"
        run_duration_number: "Zone 2 Duration"
        valve_switch_id: relay_2
      - valve_switch: "Zone 3"
        enable_switch: "Enable Zone 3"
        run_duration_number: "Zone 3 Duration"
        valve_switch_id: relay_3
      - valve_switch: "Zone 4"
        enable_switch: "Enable Zone 4"
        run_duration_number: "Zone 4 Duration"
        valve_switch_id: relay_4

switch:
  - platform: gpio
    pin: 10
    id: relay_1
    icon: "mdi:sprinkler-variant"
    
  - platform: gpio
    pin: 11
    id: relay_2
    name: "Zone 2"
    icon: "mdi:sprinkler-variant"
    
  - platform: gpio
    pin: 12
    id: relay_3
    icon: "mdi:sprinkler-variant" 
    
  - platform: gpio
    pin: 13
    id: relay_4
    icon: "mdi:sprinkler-variant"